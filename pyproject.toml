[project]
name = "air-briefing-studio"
version = "0.1.0"
description = "Civic Air Quality Briefing Studio (PromptWars)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "plotly>=5.24",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
